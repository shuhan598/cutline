services:
  cutline-algorithm:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ${CUTLINE_LOG_HOST_DIR:-./deploy/logs}:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
